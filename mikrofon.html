<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remanent — test mikrofonu</title>
<style>
/* Strona diagnostyczna: rozpoznawanie mowy z włączanymi po kolei elementami aplikacji (kamera, piknięcie, wibracja) */
:root{--bg:#f3f4f2;--panel:#fff;--fg:#1b1f24;--muted:#5d6670;--line:#d9ddd8;--accent:#e8a317;--ok:#2f8f4e;--bad:#c43d32;
  --mono:ui-monospace,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--panel:#1e242b;--fg:#e9ece8;--muted:#97a1aa;--line:#2f3740;--accent:#f0b429;--ok:#4cbf72;--bad:#ef6a5e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px 40px;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
h1{font:600 17px var(--mono);margin:4px 0 12px;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
label{display:flex;gap:10px;align-items:center;padding:6px 0}
button{font:600 16px var(--sans);width:100%;min-height:52px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#1b1f24;margin-top:10px}
button.on{background:var(--bad);border-color:var(--bad);color:#fff}
#wynik{font:600 22px var(--mono);min-height:1.4em;margin-top:8px;word-break:break-word}
#log{font:12px/1.5 var(--mono);white-space:pre-wrap;max-height:50vh;overflow:auto;color:var(--muted)}
#log b{color:var(--fg)} #log .e{color:var(--bad)} #log .r{color:var(--ok)}
video{width:100%;max-height:120px;object-fit:cover;border-radius:10px;background:#000;margin-top:8px}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<h1>Test mikrofonu</h1>
<p class="hint">Mów normalnym głosem, jak do demo Google. Zmieniaj po jednym przełączniku i porównuj, kiedy rozpoznaje, a kiedy nie.</p>

<div class="panel">
  <label><input type="checkbox" id="kam"> Kamera włączona w tle (jak skaner)</label>
  <video id="vid" muted playsinline hidden></video>
  <label><input type="checkbox" id="pik"> Piknięcie przed słuchaniem</label>
  <label><input type="checkbox" id="pikStaly"> Kanał dźwięku piknięć otwarty na stałe (stare zachowanie)</label>
  <label><input type="checkbox" id="wib"> Wibracja przed słuchaniem</label>
  <label><input type="checkbox" id="ciag" checked> Tryb ciągły (wyłączone: jedna wypowiedź)</label>
  <label><input type="checkbox" id="alt"> 5 alternatyw (maxAlternatives)</label>
  <button id="start">🎤 Słuchaj</button>
</div>

<div class="panel">
  <div class="hint">Rozpoznano:</div>
  <div id="wynik"></div>
</div>

<div class="panel">
  <div class="hint">Zdarzenia (od najnowszych):</div>
  <div id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, t0 = 0, stream = null, actx = null;

function log(txt, cls = ''){
  const ms = t0 ? ((performance.now() - t0) / 1000).toFixed(2) + ' s' : '';
  const d = document.createElement('div'); if(cls) d.className = cls;
  d.textContent = `${ms.padStart(7)}  ${txt}`;
  $('log').prepend(d);
}

$('kam').onchange = async () => {
  if($('kam').checked){
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      $('vid').srcObject = stream; $('vid').hidden = false; await $('vid').play();
      log('kamera włączona');
    }catch(e){ log('kamera: ' + e.name + ' ' + e.message, 'e'); $('kam').checked = false; }
  } else {
    stream?.getTracks().forEach(t => t.stop()); stream = null; $('vid').hidden = true; log('kamera wyłączona');
  }
};

function beep(){
  try{
    const stale = $('pikStaly').checked;
    const ctx = stale ? (actx = actx || new AudioContext()) : new AudioContext();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1400; g.gain.value = .15; o.connect(g); g.connect(ctx.destination);
    if(!stale) o.onended = () => ctx.close().catch(() => {});
    o.start(); o.stop(ctx.currentTime + .09);
  }catch(e){ log('piknięcie: ' + e.message, 'e'); }
}

function stop(){ if(rec){ try{ rec.stop(); }catch{} } }

$('start').onclick = () => {
  if(rec){ stop(); return; }
  if(!SR){ log('Ta przeglądarka nie ma rozpoznawania mowy', 'e'); return; }
  $('log').textContent = ''; $('wynik').textContent = ''; t0 = performance.now();
  const ustaw = ['kam','pik','pikStaly','wib','ciag','alt'].filter(id => $(id).checked).join(', ') || 'nic';
  log('ustawienia: ' + ustaw);
  if($('pik').checked) beep();
  if($('wib').checked && navigator.vibrate) navigator.vibrate(60);
  setTimeout(() => {
    const r = rec = new SR();
    r.lang = 'pl-PL'; r.interimResults = true; r.continuous = $('ciag').checked;
    if($('alt').checked) r.maxAlternatives = 5;
    for(const ev of ['audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch'])
      r.addEventListener(ev, () => log(ev));
    r.onresult = e => {
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        const alts = Array.from(res).map(a => `„${a.transcript}” (${(a.confidence * 100).toFixed(0)}%)`).join(' | ');
        log((res.isFinal ? 'WYNIK: ' : 'częściowy: ') + alts, res.isFinal ? 'r' : '');
        if(res.isFinal) $('wynik').textContent = res[0].transcript || '(pusto)';
      }
    };
    r.onerror = e => log('BŁĄD: ' + e.error + (e.message ? ' — ' + e.message : ''), 'e');
    r.onend = () => { log('koniec'); rec = null; $('start').classList.remove('on'); $('start').textContent = '🎤 Słuchaj'; };
    $('start').classList.add('on'); $('start').textContent = '⏹ Zatrzymaj';
    try{ r.start(); log('start'); }catch(e){ log('start: ' + e.message, 'e'); }
  }, 300);
};
</script>
</body>
</html>
